<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>7天徒步路线 · 大兴安岭与草原路线草案</title>
    <link rel="stylesheet" href="/map/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="sidebar" aria-label="数据概览">
        <div class="brand">
          <span class="kicker">Amap JS API</span>
          <h1>徒步路线地图</h1>
        </div>

        <div class="metrics">
          <div>
            <strong id="poiCount">0</strong>
            <span>POI</span>
          </div>
          <div>
            <strong id="trustedCount">0</strong>
            <span>可信点</span>
          </div>
          <div>
            <strong id="routeKm">0</strong>
            <span>路线 km</span>
          </div>
        </div>

        <div id="routeGroupControls" class="route-tabs" aria-label="路线组"></div>

        <div class="tool-row" aria-label="测距工具">
          <button id="measureToggle" class="tool-button" type="button" aria-pressed="false">测路线距离</button>
          <button id="measureClear" class="tool-button secondary" type="button">清除</button>
        </div>
        <p id="measureStatus" class="measure-status"></p>

        <div class="filters" aria-label="图层">
          <button class="filter active" data-layer="bureau" aria-pressed="true" type="button">林业局</button>
          <button class="filter active" data-layer="farm" aria-pressed="true" type="button">林场</button>
          <button class="filter" data-layer="unverified" aria-pressed="false" type="button">待核查</button>
        </div>

        <label class="search">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="输入路线、林场、林业局或镇名" />
        </label>

        <p id="zoomHint" class="zoom-hint"></p>

        <ul id="resultsList" class="results-list" aria-label="搜索结果"></ul>

        <section id="detailPanel" class="detail-panel" aria-label="详情">
          <article class="detail-card">
            <span>默认视图</span>
            <h2>全部路线</h2>
            <p>草案路线均标记为待核查。点击路线段、节点或搜索结果查看详情。</p>
          </article>
        </section>

        <ol id="routeList" class="route-list" aria-label="路线段"></ol>
      </section>

      <section class="map-wrap" aria-label="地图">
        <div id="map" class="real-map" aria-label="高德地图"></div>
        <div id="loadingState" class="state-overlay">正在加载...</div>
        <div id="errorState" class="state-overlay error" hidden>
          <strong id="errorTitle">地图不可用</strong>
          <p id="errorBody"></p>
        </div>
        <div class="legend">
          <span><i class="dot anchor"></i>可信锚点</span>
          <span><i class="dot draft"></i>草案节点</span>
          <span><i class="dot bureau"></i>林业局</span>
          <span><i class="dot farm"></i>林场</span>
          <span><i class="dot related"></i>待核查</span>
          <span><i class="line"></i>可信路线</span>
          <span><i class="line dashed"></i>草案路线</span>
        </div>
      </section>
    </main>

    <script src="/map/app.js"></script>
  </body>
</html>
