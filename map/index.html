<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>路书规划器 · 徒步路线</title>
    <link rel="stylesheet" href="/map/styles.css" />
  </head>
  <body>
    <main id="plannerShell" class="planner-shell">
      <aside class="planner-panel" aria-label="路书编辑器">
        <header class="planner-head">
          <div>
            <span class="kicker">Routebook Planner</span>
            <h1>路书规划器</h1>
          </div>
          <div class="planner-head-actions">
            <button id="leftPanelToggle" type="button" aria-expanded="true">收起编辑</button>
            <strong id="saveState" class="save-state">未保存</strong>
          </div>
        </header>

        <section class="routebook-bar" aria-label="路书管理">
          <select id="routebookSelect" aria-label="选择路书"></select>
          <button id="newRoutebook" type="button">新建</button>
          <button id="duplicateRoutebook" type="button">复制</button>
          <button id="deleteRoutebook" type="button">删除</button>
        </section>

        <section id="routebookForm" class="routebook-form" aria-label="当前路书"></section>

        <section class="metrics" aria-label="路书统计">
          <div>
            <strong id="dayCount">0</strong>
            <span>天</span>
          </div>
          <div>
            <strong id="planKm">0</strong>
            <span>计划 km</span>
          </div>
          <div>
            <strong id="walkingKm">0</strong>
            <span>高德 km</span>
          </div>
        </section>

        <section class="day-toolbar" aria-label="Day 操作">
          <button id="addDay" type="button">添加 Day</button>
          <button id="calculateAll" type="button">计算全部距离</button>
          <button id="saveRoutebooks" class="primary" type="button">保存</button>
        </section>

        <section id="dayList" class="day-list" aria-label="Day 列表"></section>
      </aside>

      <section class="map-stage" aria-label="路书地图">
        <div id="map" class="real-map" aria-label="高德地图"></div>
        <button id="rightPanelToggle" class="routebook-toggle" type="button" aria-expanded="false">路书</button>
        <section id="detailPanel" class="detail-panel" aria-label="选中详情"></section>
        <div id="loadingState" class="state-overlay">正在加载...</div>
        <div id="errorState" class="state-overlay error" hidden>
          <strong id="errorTitle">地图不可用</strong>
          <p id="errorBody"></p>
        </div>
        <div class="legend">
          <span><i class="dot start"></i>起终点</span>
          <span><i class="line planned"></i>高德路线</span>
          <span><i class="line intent"></i>待核查连接</span>
        </div>
      </section>
    </main>

    <script src="/map/app.js"></script>
  </body>
</html>
